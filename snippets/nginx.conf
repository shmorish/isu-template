# 必要な部分だけ s1/etc/nginx/ の該当箇所にコピーする

# --- http {} 内: alp 用 JSON ログ ---
log_format json escape=json '{"time":"$time_iso8601",'
  '"host":"$remote_addr","method":"$request_method","uri":"$request_uri",'
  '"status":"$status","body_bytes":"$body_bytes_sent",'
  '"reqtime":"$request_time","apptime":"$upstream_response_time"}';
access_log /var/log/nginx/access.log json;
# 終盤: access_log off;

# --- http {} 内: 基本チューニング ---
sendfile on;
tcp_nopush on;
keepalive_requests 10000;
gzip_static on;               # 事前に gzip -k した .gz があれば返す

# --- アプリへの keepalive (コネクション使い回し) ---
upstream app {
  server 127.0.0.1:8080;
  # server 192.168.0.12:8080;  # 複数台: 重み付けは weight=2
  keepalive 128;
}

server {
  # 静的ファイルは nginx が直接返す + ブラウザキャッシュ (ISUCON4 はこれ1行で勝負が決まった)
  location ~ ^/(css|js|img|assets|favicon) {
    root /home/isucon/webapp/public;
    expires 1d;
  }

  # 重いエンドポイントだけ別ホストへ振る例
  # location /api/heavy { proxy_pass http://192.168.0.13:8080; }

  # アプリが X-Accel-Redirect: /internal/images/xxx.png を返すと nginx がファイルを返す
  location /internal/ {
    internal;
    alias /home/isucon/files/;
    expires 1d;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";   # upstream keepalive に必須
    proxy_set_header Host $host;
    proxy_pass http://app;
  }
}
